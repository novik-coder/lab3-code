spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback
        - id: reservation-service
          uri: lb://RESERVATION-SERVICE
          predicates:
            - Path=/api/v1/reservations/**
          filters:
            - name: CircuitBreaker
              args:
                name: reservationServiceCircuitBreaker
                fallbackUri: forward:/fallback
        - id: library-service
          uri: lb://LIBRARY-SERVICE
          predicates:
            - Path=/api/v1/libraries/**
          filters:
            - name: CircuitBreaker
              args:
                name: libraryServiceCircuitBreaker
                fallbackUri: forward:/fallback
        - id: rating-service
          uri: lb://RATING-SERVICE
          predicates:
            - Path=/api/v1/rating/**
          filters:
            - name: CircuitBreaker
              args:
                name: ratingServiceCircuitBreaker
                fallbackUri: forward:/fallback
eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}
  resilience4j:
    circuitbreaker:
      instances:
        userServiceCircuitBreaker:
          registerHealthIndicator: true
          failureRateThreshold: 50   # 失败率阈值，超过50%失败时触发断路器
          slidingWindowSize: 10     # 窗口大小，表示在10次请求内计算失败率
          waitDurationInOpenState: 10000ms  # 在断路器打开状态下等待的时间，10秒后重新尝试
          permittedNumberOfCallsInHalfOpenState: 3  # 半开状态下，允许的请求数
        reservationServiceCircuitBreaker:
          registerHealthIndicator: true
          failureRateThreshold: 50
          slidingWindowSize: 10
          waitDurationInOpenState: 10000ms
          permittedNumberOfCallsInHalfOpenState: 3

server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /manage
  endpoint:
    health:
      show-details: always
